# Mojang web+DB preset (paired 03+04, step 2): web tier + MySQL tier.
#
# Same catalogue/seeds/flaws as mojang-web-01, except the web app reads the
# twelve fictional purchases from MySQL 8.0 through PyMySQL with a read-only
# application role (SELECT-only). Logical integrity is checked with an
# authenticated read-only SELECT (`mysql_rows`, exact count 12 + pinned buyer
# text) — never a raw disk hash of `/var/lib/mysql/*`, which changes on
# ordinary writes by design.
id: mojang-web-db-01
name: "Mojang web shop (MySQL)"
difficulty: 3
focus: [web, data, lateral, priv-esc]
est_minutes: 90
techniques: [T1190, T1068, T1005, T1505.003]
version: 3
seed_version: 1
image_version: noble-20260926
topology:
  hosts:
    - name: attacker
      template_vmid: 9005
      ip: 10.66.0.9
      services: [ssh]
      os: linux
    - name: web01
      template_vmid: 9011
      ip: 10.66.0.10
      services: [http, mojang-web, ssh]
      os: linux
      # plan 13 phase 3: deploy-time provisioning rewrites the app config
      # to target the OWNED DB IP with a fresh per-deployment reader
      # credential (never baked into the template).
      db_ref: db01
    - name: db01
      template_vmid: 9012
      ip: 10.66.0.11
      services: [mysql, ssh]
      os: linux
red:
  start_phase: recon
  objectives:
    - id: foothold
      phase: initial-access
      description: "Execute as web-user through the documented diagnostic flaw"
      verifier: flag_file_present
      args: { host: web01, path: /tmp/mojang-diag-proof.txt,
              expected_content: "DIAG{web-user}" }
    - id: priv-esc
      phase: priv-esc
      description: "Escalate to guest root through the maintenance helper; as root write FLAG{web01-root} into /root/flag_priv_esc.txt to prove it"
      verifier: flag_file_present
      args: { host: web01, path: /root/flag_priv_esc.txt,
              expected_content: "FLAG{web01-root}" }
    - id: loot
      phase: objectives
      description: "Stage exfiltrated customer rows on the web tier"
      args: { host: web01, path: /tmp/exfil/loot,
              expected_content: "buy-001" }
      verifier: exfil_flag
    - id: persistence
      phase: persistence
      verifier: cron_persistence_present
      args: { host: web01, baseline_files: [mojang-web-clean] }
scoring:
  blue_checks:
    - { verifier: no_rogue_admin, host: web01, points: 10, domain: identify }
    - { verifier: firewall_enabled, host: web01, points: 5, domain: protect }
    - { verifier: rogue_account, host: db01, points: 10, domain: identify,
        known_users: [root, daemon, bin, sys, sync, games, man, lp, mail, news, uucp, proxy, www-data, backup, list, irc, nobody, systemd-network, systemd-resolve, systemd-timesync, systemd-oom, messagebus, syslog, _apt, uuidd, tcpdump, sshd, tss, defender, web-user, mysql, srshipper, dhcpcd, fwupd-refresh, landscape, polkitd, pollinate] }
    - { verifier: http_content, host: web01, points: 10, domain: recover,
        expected_text: "Minecraft Legends", path: / }
    - { verifier: mysql_rows, host: db01, points: 15, domain: recover,
        table: purchases, expected_count: 12, expected_text: "buy-001" }
    - { verifier: service_present, host: web01, points: 5, domain: recover,
        service: mojang-web }
    - { verifier: cron_persistence_present, host: web01, points: 10, domain: detect,
        expect: absent, baseline_files: [mojang-web-clean] }
