# A deliberately small scenario proving the M4 contract: an entirely NEW
# practice mode can be defined by a YAML file alone (no code changes), reusing
# existing verifier ids, and the whole pipeline (validate → launch → verify →
# score → AAR) works on it unchanged.
id: quick-win-01
name: "Quick win: flag + clean baseline"
difficulty: 1
focus: [forensics, basics]
est_minutes: 15
techniques: [T1074]
version: 1
topology:
  hosts:
    - name: web01
      template_vmid: 9001
      ip: 10.66.0.10
      services: [http]
      os: linux
red:
  start_phase: recon
  objectives:
    - id: flaggrab
      phase: initial-access
      verifier: flag_file_present
      args: { host: web01, path: /root/flag_quickwin.txt,
              expected_content: "FLAG{quick-win}" }
scoring:
  blue_checks:
    - { verifier: no_rogue_admin, host: web01, points: 10, domain: identify }
    - { verifier: service_present, host: web01, service: sshd, points: 5, domain: protect }
