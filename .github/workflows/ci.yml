name: ci
# Real commands, real disposable infrastructure, required layers FAIL CLOSED
# (audit F8/F22/F23): every layer runs through infra/dev/acceptance.py with
# its SR_REQUIRE_* flag, so an absent prerequisite, empty selection, or
# skipped required test is a red job — never a silent skip. Standard GitHub
# Linux VMs only; privileged packet rules execute ONLY inside disposable
# network namespaces (the tests create and remove them); nothing here
# touches host firewall state or non-run-owned resources.
on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

# The db layer includes tests combining DB + containment prerequisites (the
# worker-chain regressions). BOTH jobs below therefore run their gate INSIDE
# a delegated cgroup v2 subtree: the runner's own cgroup is root-owned, so an
# unprivileged process cannot migrate its children out of it — ownership of
# a created directory alone is not migration permission (audit B10). The
# wrapper performs the move as root, verifies it, then drops to the
# unprivileged user; the acceptance gate re-probes migration before tests.
defaults:
  run:
    shell: bash

jobs:
  selection:
    # classification invariants: every test is fast-default or a required
    # layer; required modes fail for absent prereqs / empty selections
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.lock
          .venv/bin/pip install --no-deps -e .
      - run: .venv/bin/python infra/dev/acceptance.py selection

  python:
    # fresh locked installs + dependency consistency + entrypoint imports
    # across the supported matrix (no re-resolve: exact pins, --no-deps app)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Fresh run-owned locked install + imports (this interpreter)
        env:
          SR_ACCEPTANCE_PYTHONS: ${{ matrix.python-version }}
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.lock
          .venv/bin/pip install --no-deps -e .
          .venv/bin/python infra/dev/acceptance.py python
      - name: Fast default suite (infrastructure-free)
        run: .venv/bin/python -m pytest -q -ra

  db:
    # disposable postgres:16 fixture (run-owned container/volume): fresh
    # migrations, populated forward 0010 upgrade, grants, regressions. The
    # layer includes worker-chain tests that ALSO need the containment
    # boundary, so this job provides BOTH prerequisites.
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.lock
          .venv/bin/pip install --no-deps -e .
      - &userns-boundary
        name: Permit the supervisor's userns boundary (Ubuntu 24.04 AppArmor)
        # Ubuntu 24.04+ (GitHub runner images included) restricts
        # unprivileged user namespaces to binaries with an AppArmor profile
        # granting `userns`; without it the runner-supervisor's trusted
        # user+mount+cgroup+pid boundary cannot be created and it refuses
        # every start (exit 4). Ubuntu's documented mechanism is a SCOPED
        # profile for exactly one binary (/usr/bin/unshare) on this
        # disposable runner VM — never the global
        # kernel.apparmor_restrict_unprivileged_userns=0 switch.
        #
        # The profile MUST be a real CONFINED profile (upstream apparmor's
        # bwrap-userns-restrict pattern), NOT flags=(unconfined)+userns:
        # a flags=(unconfined) profile leaves the process in the kernel's
        # "unconfined state", and Ubuntu then transitions such userns
        # creators into the restrictive unprivileged_userns profile, whose
        # `deny capability` makes the boundary's inner bind/tmpfs mounts
        # fail (exit 96). A confined profile keeps its own permissions
        # inside the namespace, and exec'd children (bash, mount, the
        # command) inherit it. Grants are the minimum the boundary performs.
        run: |
          set -euo pipefail
          sudo tee /etc/apparmor.d/usr.bin.unshare > /dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile unshare /usr/bin/unshare flags=(attach_disconnected,mediate_deleted) {
            allow capability,
            allow file rwlkm /{**,},
            allow network,
            allow unix,
            allow ptrace,
            allow signal,
            allow userns,
            allow mount,
            allow umount,

            # EXEC grant with profile INHERITANCE: under abi/4.0 (policy
            # v6) the file 'm' bit is mmap-exec, NOT execute — without an
            # x rule the confined unshare cannot even exec sh inside the
            # boundary (EACCES, CI round 3). 'ix' keeps every exec'd child
            # (bash, mount, the operation command) in this profile, so
            # capability/mount stay available inside the namespace.
            /** rix,

            include if exists <local/unshare>
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/usr.bin.unshare
          # profile sanity: the boundary namespaces can be created and a
          # child exec'd inside them. The FULL boundary probe (including
          # the supervisor's two inner mounts against a real cgroup dir)
          # runs in the delegated-cgroup step below, once a bindable
          # operation cgroup exists.
          unshare --user --map-root-user --mount --cgroup --pid --fork \
            --mount-proc /bin/true
      - &delegate-cgroup
        name: Delegate a cgroup v2 subtree for runner containment
        run: |
          set -euo pipefail
          test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs || {
            echo "no cgroup v2 on this runner"; exit 1; }
          sudo mkdir -p /sys/fs/cgroup/srrunner
          sudo chown "$(id -u):$(id -g)" /sys/fs/cgroup/srrunner
          # the control FILES keep root ownership unless chowned too: the
          # kernel requires the delegatee to WRITE cgroup.procs for any
          # migration into or out of this cgroup (audit B10, review P1)
          sudo chown "$(id -u):$(id -g)" /sys/fs/cgroup/srrunner/cgroup.procs
          test -w /sys/fs/cgroup/srrunner/cgroup.procs
          # FULL boundary probe, exactly the supervisor's sequence: inside
          # user+mount+cgroup+pid namespaces, BIND the operation's own
          # cgroup directory onto /sys/fs/cgroup (a fresh cgroup2 superblock
          # mount is refused EBUSY from a non-init userns on 6.8-era kernels
          # — Ubuntu 24.04 — by the kernfs superblock userns check) and
          # tmpfs-mask a directory. Run-owned probe cgroup, removed after.
          mkdir /sys/fs/cgroup/srrunner/.sr-probe
          trap 'rmdir /sys/fs/cgroup/srrunner/.sr-probe 2>/dev/null || true' EXIT
          unshare --user --map-root-user --mount --cgroup --pid --fork \
            --mount-proc sh -c 'mount --bind /sys/fs/cgroup/srrunner/.sr-probe \
            /sys/fs/cgroup && mount -t tmpfs tmpfs /mnt'
          rmdir /sys/fs/cgroup/srrunner/.sr-probe
          trap - EXIT
      - name: Run the DB layer unprivileged INSIDE the delegated subtree
        run: |
          sudo env "PATH=$PATH" "HOME=$HOME" \
            infra/dev/run_in_cgroup.sh /sys/fs/cgroup/srrunner "$USER" \
            .venv/bin/python infra/dev/acceptance.py db

  containment:
    # real supervisor + namespace boundary regressions under an explicitly
    # delegated cgroup v2 subtree, unprivileged identity, required mode
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.lock
          .venv/bin/pip install --no-deps -e .
      - *userns-boundary
      - *delegate-cgroup
      - name: Run containment unprivileged INSIDE the delegated subtree
        run: |
          sudo env "PATH=$PATH" "HOME=$HOME" \
            infra/dev/run_in_cgroup.sh /sys/fs/cgroup/srrunner "$USER" \
            .venv/bin/python infra/dev/acceptance.py containment

  authority:
    # broker private boundary: policy, durable ledger, real mutual-TLS,
    # cessation read-back + lease races (infrastructure-free, required mode)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.lock
          .venv/bin/pip install --no-deps -e .
      - run: .venv/bin/python infra/dev/acceptance.py authority

  packet:
    # real nft round-trip + netns packet semantics; the job runs the tests
    # as root ONLY so they can create DISPOSABLE network namespaces — the
    # tests never apply rules to the host namespace
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.lock
          .venv/bin/pip install --no-deps -e .
      - run: sudo apt-get update && sudo apt-get install -y nftables iproute2
      - run: sudo env "PATH=$PATH" "$GITHUB_WORKSPACE/.venv/bin/python" infra/dev/acceptance.py packet

  frontend:
    # npm ci + production build + zero high/critical production audit
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.lock
          .venv/bin/pip install --no-deps -e .
      - run: .venv/bin/python infra/dev/acceptance.py frontend

  compose:
    # real image build + bootstrap + idempotent rerun with run-owned
    # project/ports and synthetic credentials; cleans only its own stack
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.lock
          .venv/bin/pip install --no-deps -e .
      - run: .venv/bin/python infra/dev/acceptance.py compose

  browser-e2e:
    # Real Chromium drives the built web app against the real API + worker
    # (controlled PVE/model/runner/verifier/datapath) plus replay seek. The
    # CLI is the PINNED local one (web devDependency); the session, ports
    # and dist dir are run-owned. Required mode: no silent skips.
    needs: [frontend]
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.lock
          .venv/bin/pip install --no-deps -e .
      - name: Web deps (installs the pinned @playwright/cli) + Chromium
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - run: .venv/bin/python infra/dev/acceptance.py browser
