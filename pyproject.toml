[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparring-range"
version = "0.1.0"
description = "AI Red-Team Sparring Range — see plan.markdown (Parts 1-7 are the contract)"
requires-python = ">=3.11"
dependencies = [
    # Part 2 — decided stack. Do not add libraries without justification.
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "asyncssh>=2.14",
    "proxmoxer>=2.0",
    "openai>=1.40",
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
rangectl = "rangectl.cli:app"

[tool.setuptools.packages.find]
include = ["rangectl*", "infra*", "srplatform*", "verifiers*", "telemetry*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Test layers (audit F22/F8, milestone 01): the DEFAULT selection is
# infrastructure-free — plain `pytest` must never skip for a missing
# integration prerequisite. Integration layers are explicit markers, and a
# required job (SR_REQUIRE_<LAYER>=1) FAILS for an absent prerequisite, an
# empty selection, or a skipped required test — never silently skips.
#   db          real disposable PostgreSQL (SR_PG_ADMIN_URL/SR_PG_ADMIN_CMD)
#   containment real cgroup v2 delegation + namespace boundary (runner supervisor)
#   packet      real nft/netns packet semantics, disposable namespaces only
#   adapter     production-adapter contract tests against simulated transports
#   browser     end-to-end browser tests (opt-in; also needs db)
#   live        operator live-infrastructure acceptance gate (never automatic)
markers = [
    "db: requires a real (disposable) PostgreSQL — explicit admin via SR_PG_ADMIN_URL/SR_PG_ADMIN_CMD",
    "containment: requires a delegated cgroup v2 root and working unshare namespaces",
    "packet: requires root + nft + iproute2 (rules only inside disposable netns)",
    "adapter: production-adapter contract tests against simulated transports",
    "browser: end-to-end browser tests (opt-in)",
    "live: operator live-infrastructure acceptance gate (never automatic)",
]
addopts = "-m 'not db and not containment and not packet and not browser and not live'"
